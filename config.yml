work_dir: null  # default to null
seed: 42

# wandb
disable_wandb: False
wandb_entity: null  # user
wandb_project: sac
wandb_silent: False
exp_name: null
task_title: null
save_csv: True
save_video: False
save_agent: False
action_dim: null  # placeholder
steps: null # placeholder

Agent:
  num_steps: 8_000_000
  batch_size: 128
  memory_size: 8_000_000
  offline_buffer_size: 12_000_000
  use_offline_buffer: False # offline dual buffer
  update_interval: 1
  start_steps: 2000
  log_interval: 10
  checkpoint_freq: 200_000

SAC:
  gamma: 0.992
  nstep: 3
  policy_lr: 0.0003
  q_lr: 0.0003
  entropy_lr: 0.0003
  policy_hidden_units: [256, 256, 256]
  q_hidden_units: [256, 256, 256]
  target_update_coef: 0.005
  log_interval: 10

DisCor:
  error_lr: 0.0003
  error_hidden_units: [256, 256, 256, 256]
  tau_init: 10.0

AssettoCorsa:
  ego_sampling_freq: 25     # in Hz
  max_episode_py_time: 600. # in seconds
  gap_const: 12.
  eval_number_of_laps: 4    # including out lap which is incomplete
  save_lap_csv: False
  remote_machine_ip: "localhost"   # "192.168.0.1" # "localhost"
  ego_server_port: 2345
  opponents_server_port: 2346
  simulation_management_server_port: 2347
  use_relative_actions: False
  enable_sensors: True
  vjoy_executed_by_server: False
  enable_out_of_track_termination: True
  enable_low_speed_termination: True
  recover_car_on_done: False
  send_reset_at_start: True
  record_controls_from_client: False
  enable_out_of_track_penalty: False
  max_laps_number: null
  enable_task_id_in_obs: False
  penalize_actions_diff: False
  penalize_actions_diff_coef: 0.1
  max_steer_rate: 900.0   # steering: deg/s
  track: "monza"
  car: "bmw_z4_gt3"
  use_ac_out_of_track: True
  add_previous_obs_to_state: True
  use_reference_line_in_reward: True
  use_target_speed: False

controller:
  backend: vjoy
  device_id: 1
  dll_path: null
  copy_upstream_mapping: True
  action_order: [steer, pedal_delta]
  steer_rate_limit_deg_s: 900.0
  pedal_rate_limit_per_s: 12.0

observation:
  history_length: 3
  include_previous_actions: True
  include_force_feedback: True
  include_track_relative_features: True
  curvature_lookahead_points: 12
  curvature_lookahead_distance_m: 300

reward:
  w_progress: 1.0
  w_gap: 0.35
  w_heading: 0.15
  w_offtrack: 2.0
  w_terminal_stuck: 3.0
  w_low_speed: 0.20
  low_speed_target_kmh: 25.0
  w_steer: 0.03
  w_steer_delta: 0.0
  w_overlap: 0.0

termination:
  low_speed_threshold_kmh: 5.0
  low_speed_timeout_s: 5.0
  stuck_distance_threshold_m: 2.0
  stuck_timeout_s: 5.0

trainer:
  strict_scalar_rewards: True
  treat_truncation_as_terminal: False
  eval_uses_direct_step_action: False

# ===== CURRICULUM LEARNING =====
curriculum:
  enable: True                 # Enable/disable curriculum learning
  strategy: 'linear'           # 'linear', 'exponential', or 'step'
  initial_weight: 1.0          # Starting racing line reward weight (0-1)
  final_weight: 0.1            # Ending racing line reward weight (0-1)
  decay_steps: 100_000         # Number of training steps over which to decay

# ===== RACING LINE REWARDS =====
racing_line:
  enable: True                 # Enable/disable racing line distance rewards
  track_name: 'monza'          # Track name used to find Racing Lines/{track}_racing_line.csv
  
  # Reward configuration
  line_distance_weight: 1.0    # Multiplier weight (1.0 = full gap penalty, matches assetto_corsa_gym)
  line_distance_threshold: 12.0  # Gap constant in meters (matches assetto_corsa_gym gap_const: 12)
