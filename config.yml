work_dir: null
seed: 0

Agent:
  num_steps: 12_000_000
  batch_size: 256
  memory_size: 5_000_000
  offline_buffer_size: 1_250_000
  use_offline_buffer: True
  update_interval: 1
  start_steps_count: "online_steps"
  start_steps: 5000
  log_interval: 10
  eval_interval: 0
  num_eval_episodes: 1
  checkpoint_freq: 500_000
  save_final_buffer: True
  save_checkpoint_buffer: True

OfflineSampling:
  enabled: True
  initial_offline_ratio: 0.6
  final_offline_ratio: 0.05
  transition_steps: 3_000_000

ShiftCurriculum:
  enabled: True
  auto_only_steps: 1_500_000
  eval_use_manual: False
  handoff_bc_updates: 5000
  handoff_prompt: "Turn off Assetto Corsa automatic shifting, then press SPACE to continue training."

ShiftExploration:
  execute_deterministic: True
  initial_epsilon: 0.02
  final_epsilon: 0.0
  epsilon_decay_steps: 1_000_000
  prevent_low_gear_downshift: True
  min_downshift_gear: 2
  max_gear: 6

SAC:
  gamma: 0.997
  nstep: 3
  policy_lr: 0.0003
  q_lr: 0.0003
  entropy_lr: 0.0003
  target_entropy: -3.0
  policy_hidden_units: [256, 256, 256]
  q_hidden_units: [256, 256, 256]
  target_update_coef: 0.005
  log_interval: 10

ShiftModel:
  enabled: True
  lr: 0.0003
  entropy_lr: 0.0001
  hidden_units: [256, 256, 256]
  threshold: 0.65
  target_entropy: 0.05
  reward_scale: 1.0
  bc_loss_weight: 0.5
  bc_class_weights: [0.15, 6.0, 6.0]
  bc_focal_gamma: 1.5

Demonstrations:
  enabled: True
  data_path: null
  data_paths:
    - "C:\\Users\\Leo\\Documents\\Github\\AutonomousRacingAgent\\demonstrations\\session_02"
  pretrain_epochs: 0
  shift_pretrain_epochs: 1
  log_steer_ratios: False
  filter:
    enabled: True
    max_lap_samples: 4000
    max_abs_progress_delta_m: 20.0
    min_speed_ms: 1.0

DemonstrationLearning:
  actor_bc_loss_weight: 0.05
  actor_bc_min_loss_weight: 0.0
  actor_bc_decay_steps: 2_000_000
  actor_bc_mode: "awac_q_filter"
  actor_bc_temperature: 2.0
  actor_bc_max_weight: 20.0
  actor_bc_q_filter_margin: 0.0
  actor_bc_q_filter_warmup_steps: 2000

AssettoCorsa:
  ego_sampling_freq: 25
  max_episode_py_time: 600.0
  eval_number_of_laps: 4
  remote_machine_ip: "localhost"
  ego_server_port: 2345
  opponents_server_port: 2346
  simulation_management_server_port: 2347
  control_backend: "vigem"
  use_relative_actions: True
  enable_sensors: True
  vjoy_executed_by_server: False
  enable_out_of_track_termination: True
  enable_low_speed_termination: True
  recover_car_on_done: False
  send_reset_at_start: True
  max_laps_number: null
  enable_task_id_in_obs: False
  max_steer_rate: 900.0
  track: "monza"
  car: "bmw_z4_gt3"
  use_ac_out_of_track: True
  add_previous_obs_to_state: True
  use_target_speed: False
  enforce_mutually_exclusive_pedals: True
  screen_capture_enable: False
  final_image_width: 320
  final_image_height: 240
  color_mode: "gray"
  use_obs_extra: False

  ShiftExecution:
    threshold: 0.65
    cooldown_s: 0.20
    prevent_reverse_downshift: True

  Curriculum:
    enabled: True
    duration_steps: 3_000_000
    start_line_penalty_scale: 0.25
    start_border_penalty_scale: 0.25
    start_action_penalty_scale: 0.0
    start_off_track_penalty_scale: 1.0

  Rewards:
    mode: "progress"
    use_reference_line_in_reward: True
    progress_reward_scale: 0.1
    forward_speed_reward_scale: 0.03
    reference_line_penalty_coef: 0.08
    reference_line_margin_m: 6.0
    border_margin_m: 1.5
    border_penalty_coef: 0.08
    lateral_velocity_penalty_coef: 0.02
    backwards_penalty_coef: 0.5
    off_track_penalty: 35.0
    terminated_penalty: 8.0
    low_speed_penalty: 0.03
    low_speed_threshold_ms: 2.0
    low_speed_grace_steps: 50
    lap_completion_bonus: 75.0
    max_progress_per_step_m: 8.0
    penalize_actions_diff: True
    penalize_actions_diff_coef: 0.02
